<!DOCTYPE html>
<html lang="es">
<head>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Diseños - L-FUTURE</title>
    <link rel="stylesheet" href="/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <!-- Estilos para Notificaciones Toast -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/izitoast/dist/css/iziToast.min.css">

    <!-- Scripts -->
    <script src="config.js"></script>
    <script type="module" src="auth.js"></script>
    <script src="api.js"></script>
    <script src="idiomas.js"></script>
    <script src="user-ui.js"></script>
</head>

<body>
    <script>
        if (!requireAuth()) {
            // Redirige a login si no está autenticado
        }
    </script>

    <div class="contenedor-principal">
        <!-- Barra lateral de navegación -->
        <aside class="barra-lateral">
            <div class="logo">
                <h1 class="titulo">L-FUTURE</h1>
                <p class="eslogan">Innovación en moda digital</p>
            </div>
            <nav class="menu-navegacion">
                <ul>
                    <li><a href="inicio.html"><i class="fas fa-home"></i> <span>Inicio</span></a></li>
                    <li><a href="diseños1.0.html" class="activo"><i class="fas fa-shirt"></i> <span>Mis Proyectos</span></a></li>
                    <li><a href="diseños L-Future.html"><i class="fas fa-globe-americas"></i> <span>Proyectos L-FUTURE</span></a></li>
                    <li><a href="sobre nosotros.html"><i class="fas fa-users"></i> <span>Sobre Nosotros</span></a></li>
                    <li><a href="editor-3d.html"><i class="fas fa-paint-brush"></i> <span>Diseños-3D</span></a></li>
                    <li><a href="perfil.html"><i class="fas fa-cog"></i> <span>Configuración</span></a></li>
                </ul>
            </nav>
            <div class="info-usuario-lateral">
                <div class="avatar">
                    <img src="" alt="Avatar usuario" class="user-avatar">
                </div>
                <h3 class="user-name">Usuario</h3>
                <span class="badge user-type-badge">Usuario</span>
            </div>
            <button class="btn-signout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
            <button class="btn-cerrar-movil">
                <i class="fas fa-times"></i>
            </button>
        </aside>

        <!-- Contenido principal -->
        <main class="contenido-principal">
            <header class="encabezado">
                <div class="encabezado-izquierda">
                    <button class="btn-menu" aria-label="Abrir menú">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h2>MIS PROYECTOS <span id="contador-proyectos" class="contador"></span></h2>
                </div>
                <div class="avatar-encabezado">
                    <img src="" alt="Avatar usuario" class="user-avatar">
                    <div class="encabezado-username"></div>
                </div>
            </header>

            <!-- Controles de Proyectos (Búsqueda, Filtros, Ordenamiento) -->
            <section class="controles-grid">
                <div class="grupo-control busqueda">
                    <i class="fas fa-search"></i>
                    <input type="text" id="inputBusqueda" placeholder="Buscar por nombre, descripción...">
                </div>
                <div class="grupo-control">
                    <label for="selectEstado">Estado:</label>
                    <select id="selectEstado" title="Filtrar por estado del proyecto">
                        <option value="todos">Todos</option>
                        <option value="en_progreso">En Progreso</option>
                        <option value="completado">Completado</option>
                    </select>
                </div>
                <div class="grupo-control">
                    <label for="selectTag">Etiqueta:</label>
                    <select id="selectTag" title="Filtrar por etiqueta">
                        <option value="todos">Todas</option>
                        <!-- Las etiquetas se llenarán dinámicamente -->
                    </select>
                </div>
                <div class="grupo-control">
                    <label for="selectOrdenar">Ordenar por:</label>
                    <select id="selectOrdenar" title="Ordenar proyectos">
                        <option value="fecha_modificacion-desc">Modificación</option>
                        <option value="fecha_creacion-desc">Más Recientes</option>
                        <option value="fecha_creacion-asc">Más Antiguos</option>
                        <option value="nombre-asc">Nombre (A-Z)</option>
                        <option value="nombre-desc">Nombre (Z-A)</option>
                    </select>
                </div>
                <div class="grupo-control acciones-grid">
                    <button id="btnRefrescar" class="btn-accion-grid" title="Recargar proyectos (R)">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                    <button id="btnNuevoProyecto" class="btn-accion-grid btn-primario" title="Crear nuevo proyecto (Ctrl+N)">
                        <i class="fas fa-plus"></i> Nuevo Proyecto
                    </button>
                    <span class="tooltip-info" style="margin-left:8px; color:#FFD700; font-size:13px;" title="Tip: ¡Usa nombres descriptivos y etiquetas para organizar tus diseños!">🛈</span>
                </div>
            </section>

            <!-- Contenedor de Proyectos -->
            <section id="contenedor-proyectos" class="grid-proyectos-dinamico">
                <!-- Las tarjetas de proyecto se insertarán aquí dinámicamente -->
            </section>

            <!-- Paginación -->
            <section id="paginacion" class="paginacion-contenedor">
                <!-- La paginación se insertará aquí dinámicamente -->
            </section>

        </main>
    </div>

    <!-- Modal para Vista Previa Mejorada -->
    <div id="modalVistaPrevia" class="modal-vista-previa">
        <span class="cerrar-modal-vp" onclick="cerrarVistaPrevia()">&times;</span>
        <button id="btnModalAnterior" class="btn-navegacion-modal prev" onclick="navegarVistaPrevia(-1)" title="Anterior"><i class="fas fa-chevron-left"></i></button>
        <button id="btnModalSiguiente" class="btn-navegacion-modal next" onclick="navegarVistaPrevia(1)" title="Siguiente"><i class="fas fa-chevron-right"></i></button>
        <div class="modal-contenido-vp">
            <h3 id="tituloVistaPrevia"></h3>
            <div class="imagen-contenedor-vp">
                <div id="imagenVistaPrevia" class="imagen-vp">
                    <!-- La imagen o el texto se insertarán aquí -->
                </div>
            </div>
            <div class="controles-zoom">
                <button onclick="zoomOut()" title="Alejar"><i class="fas fa-search-minus"></i></button>
                <button onclick="zoomIn()" title="Acercar"><i class="fas fa-search-plus"></i></button>
            </div>
        </div>
    </div>

    <!-- Modal para Editar Nombre y Tags -->
    <div id="modalEditarProyecto" class="modal-vista-previa" style="display: none;">
        <div class="modal-contenido-vp" style="max-width: 500px; background: #2c2c2c; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.5);">
            <span class="cerrar-modal-vp" onclick="cerrarModalEditar()">&times;</span>
            <h3 id="tituloModalEditar">Editar Proyecto</h3>
            <form id="formEditarProyecto" style="padding: 20px;">
                <input type="hidden" id="editProyectoId">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="editNombreProyecto" style="display: block; margin-bottom: 5px;">Nombre del Proyecto</label>
                    <input type="text" id="editNombreProyecto" required style="width: 100%; padding: 10px; background: #333; border: 1px solid #555; color: white; border-radius: 4px;">
                </div>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="editDescripcionProyecto" style="display: block; margin-bottom: 5px;">Descripción</label>
                    <textarea id="editDescripcionProyecto" rows="3" style="width: 100%; padding: 10px; background: #333; border: 1px solid #555; color: white; border-radius: 4px;"></textarea>
                </div>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="editTagsProyecto" style="display: block; margin-bottom: 5px;">Etiquetas (separadas por coma)</label>
                    <div style="display:flex;gap:8px;align-items:center;">
                        <input type="text" id="editTagsProyecto" placeholder="Ej: urbano, verano, minimalista" style="width: 100%; padding: 8px; background: #333; border: 1px solid #555; color: white; border-radius: 4px;">
                        <button type="button" id="btnAddTag" title="Agregar etiqueta" style="background:#FFD700;color:#222;padding:6px 12px;border-radius:4px;border:none;cursor:pointer;font-weight:bold;">+</button>
                    </div>
                    <div id="tagsList" style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;"></div>
                </div>
                <div style="text-align: right;">
                    <button type="button" onclick="cerrarModalEditar()" class="btn-accion btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn-accion btn-primario">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>


    <!-- Scripts de la página -->
    <script src="https://cdn.jsdelivr.net/npm/izitoast/dist/js/iziToast.min.js"></script>
    <script>
        // Configuración global para Toast
        const Toast = {
            success: (message) => iziToast.success({ title: 'Éxito', message: message, position: 'topRight', timeout: 3000 }),
            error: (message) => iziToast.error({ title: 'Error', message: message, position: 'topRight', timeout: 5000 }),
            info: (message, timeout = 3000) => iziToast.info({ title: 'Info', message: message, position: 'topRight', timeout: timeout }),
        };
    </script>
    <script src="diseños1.0.js" defer></script>
    <script src="./register-sw.js" defer></script>
    <script type="module" src="./main-loader.js"></script>
    <script>
        // Script para menú móvil y lógica de la página (layout-init.js)
        document.addEventListener('DOMContentLoaded', function() {
            const btnMenu = document.querySelector('.btn-menu');
            const barraLateral = document.querySelector('.barra-lateral');
            const btnCerrarMovil = document.querySelector('.btn-cerrar-movil');

            if (btnMenu) {
                btnMenu.addEventListener('click', function() {
                    barraLateral.classList.add('activa');
                });
            }

            if (btnCerrarMovil) {
                btnCerrarMovil.addEventListener('click', function() {
                    barraLateral.classList.remove('activa');
                });
            }

            // Lógica para cerrar el menú al hacer clic fuera en móviles
            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 992 &&
                    barraLateral.classList.contains('activa') &&
                    !barraLateral.contains(e.target) &&
                    !btnMenu.contains(e.target)) {
                    barraLateral.classList.remove('activa');
                }
            });

            // Lógica para cerrar el modal de vista previa
            const modal = document.getElementById('modalVistaPrevia');
            if (modal) {
                modal.addEventListener('click', function(e) {
                    if (e.target === modal) {
                        cerrarVistaPrevia();
                    }
                });
            }

            // Cargar datos del usuario en la UI
            const user = getUser();
            if (user) {
                document.querySelectorAll('.user-name').forEach(el => el.textContent = user.username);
                document.querySelectorAll('.user-avatar').forEach(el => el.src = user.foto_perfil || 'https://placehold.co/100x100/1a1a1a/FFD700?text=' + user.username.charAt(0).toUpperCase());
                document.querySelectorAll('.user-type-badge').forEach(el => {
                    el.textContent = user.tipo_usuario.charAt(0).toUpperCase() + user.tipo_usuario.slice(1);
                    el.classList.add(`badge-${user.tipo_usuario}`);
                });
            }
        });

        // #7 Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => console.log('Service Worker registrado con éxito:', registration))
                    .catch(error => console.log('Error al registrar Service Worker:', error));
            });
        }

    </script>
    <style>
        /* Estilos para la nueva galería de proyectos */
        .controles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            padding: 20px;
            background-color: #1e1e1e;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .grupo-control {
            display: flex;
            flex-direction: column;
        }
        .grupo-control.busqueda {
            position: relative;
            grid-column: span 2;
        }
        .grupo-control.busqueda .fa-search {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }
        .grupo-control label {
            margin-bottom: 8px;
            font-size: 14px;
            color: #aaa;
        }
        .grupo-control input,
        .grupo-control select {
            width: 100%;
            padding: 10px;
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: #eee;
            border-radius: 4px;
            font-size: 14px;
        }
        .grupo-control.busqueda input {
            padding-left: 35px;
        }
        .acciones-grid {
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }
        .btn-accion-grid {
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #3a3a3a;
            color: #FFD700;
            transition: background-color 0.2s;
        }
        .btn-accion-grid:hover {
            background-color: #4a4a4a;
        }
        .btn-accion-grid.btn-primario {
            flex-grow: 1;
            background-color: #FFD700;
            color: #1a1a1a;
            font-weight: bold;
        }
        .btn-accion-grid.btn-primario:hover {
            background-color: #e0bd2a;
        }

        /* Grid de Proyectos */
        .grid-proyectos-dinamico {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            padding: 0 20px 20px;
        }

        /* Tarjeta de Proyecto */
        .tarjeta-proyecto {
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .tarjeta-proyecto:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.1);
        }

        /* Paginación */
        .paginacion-contenedor {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .controles-paginacion {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #1e1e1e;
            padding: 8px;
            border-radius: 25px;
        }
        .btn-paginacion, .btn-numero-pagina {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 15px;
        }
    </style>
</body>
</html>
