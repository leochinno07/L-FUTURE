name: E2E Playwright

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services: {}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Initialize DB
        run: python backend/init_db.py
      - name: Install frontend deps
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Start backend
        run: nohup python backend/server_simple.py > server.log 2>&1 &
      - name: Start preview server
        run: nohup npm run preview --silent > preview.log 2>&1 &
      - name: Wait for services
        run: |
          echo "Waiting for backend and preview to be ready..."
          for i in {1..30}; do
            nc -z localhost 5000 && nc -z localhost 4173 && echo "OK" && break || sleep 1
          done
      - name: Run Playwright tests
        run: npx playwright test --reporter=list
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
